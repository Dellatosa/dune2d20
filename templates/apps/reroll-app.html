<form class="{{cssClass}}" autocomplete="off">
    <div class="title">{{localize 'dune2d20.app.reroll'}}</div>
    <div class="dices-pool">
        {{#each initialRoll as |dice|}}
            <div class="dice-back">
                <div class="roll d20 {{#if determination}}determ{{/if}} {{#if critSuccess}}crit{{/if}} {{#if complication}}comp{{/if}}">{{dice.result}}</div>
            </div>
        {{/each}}
    </div>
    <div class="dices-pool">
        {{#each initialRoll as |dice|}}
            <div class="dice-back">
                {{#if dice.determination}}
                    <div class="disabled">
                        <i class="fa-regular fa-hexagon"></i>
                    </div>
                {{else}}
                    <a class="check" data-index="{{@index}}">
                        {{#if dice.select}}<i class="fa-regular fa-hexagon-check"></i>{{else}}<i class="fa-regular fa-hexagon"></i>{{/if}}
                    </a>
                {{/if}}    
            </div>
        {{/each}}
    </div>
    <button class="reroll-button" type="submit" name="submit">
          <i class="fa-solid fa-dice-d20"></i> {{localize 'dune2d20.app.rerollDices'}}
      </button>
</form>
